<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty | Faculty Attendance</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/faculty.js" defer></script>
</head>
<body>
  <div class="demo-banner" data-demo-banner hidden>Demo mode: any login is accepted</div>
  <header class="site-header">
    <a class="brand" href="/admin-dashboard.html">Faculty Attendance</a>
    <div class="header-user"><span>Signed in as <strong data-user-name></strong></span><button data-logout>Log out</button></div>
  </header>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/admin-dashboard.html">Dashboard</a>
    <a href="/faculty.html" aria-current="page">Faculty</a>
    <a href="/attendance.html">Attendance</a>
    <a href="/reports.html">Reports &amp; CSV</a>
  </nav>
  <main>
    <h1>Faculty</h1>
    <p class="subtitle">Add, edit, or remove faculty members. Removing a member also removes their attendance records.</p>
    <section class="panel">
      <h2>Faculty details</h2>
      <form id="faculty-form" class="form-row">
        <label>Name<input name="name" required maxlength="120"></label>
        <label>Department<input name="department" required maxlength="120"></label>
        <label>Email<input name="email" type="email" required maxlength="254"></label>
        <div class="actions">
          <button type="submit">Add faculty</button>
          <button type="button" class="secondary" id="cancel-edit">Cancel</button>
        </div>
      </form>
      <p class="message" id="faculty-message" role="status"></p>
    </section>
    <section class="panel" style="margin-top:20px">
      <h2>Faculty directory</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Department</th><th>Email</th><th>Actions</th></tr></thead>
          <tbody id="faculty-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
